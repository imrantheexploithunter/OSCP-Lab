services:
  api:
    build: ./backend
    image: imrantheexploithunter-api:5.0
    environment:
      DATA_DIR: /data
      LAB_SUBNET: ${LAB_SUBNET:-172.31.77.0/24}
      TARGET_IMAGE: imrantheexploithunter-target:5.0
      DNS_IMAGE: imrantheexploithunter-dns:5.0
    volumes:
      - labdata:/data
      - ${CONTAINER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped
    networks: [control]
  web:
    image: nginx:alpine
    volumes:
      - "./frontend:/usr/share/nginx/html:ro"
      - "./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    restart: unless-stopped
    networks: [control]
  dns:
    build: ./lab/dns
    image: imrantheexploithunter-dns:5.0
    profiles: [images]
  target:
    build: ./lab/target
    image: imrantheexploithunter-target:5.0
    profiles: [images]
networks:
  control:
    driver: bridge
volumes:
  labdata:
